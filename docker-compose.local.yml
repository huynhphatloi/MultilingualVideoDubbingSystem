services:
  local-ai:
    build:
      context: .
      dockerfile: local-ai-service/Dockerfile
      args:
        INSTALL_MULTI_VOICE: ${DUBFLOW_MULTI_VOICE:-false}
    environment:
      AUTH_TOKEN: ${LOCAL_API_TOKEN:-}
      DUBFLOW_DEVICE: ${DUBFLOW_DEVICE:-}
      DUBFLOW_MULTI_VOICE: ${DUBFLOW_MULTI_VOICE:-false}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - local-model-cache:/models/huggingface
      - ./colab:/app/colab:ro
      - ./dubflow_core:/app/dubflow_core:ro
    ports:
      - "127.0.0.1:${LOCAL_AI_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ai-service:
    depends_on:
      local-ai:
        condition: service_healthy
    environment:
      AI_BACKENDS: local
      LOCAL_API_URL: http://local-ai:8000
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:-}

volumes:
  local-model-cache:
