services:
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      DATA_ROOT: /data/jobs
      PUBLIC_BASE_URL: http://localhost:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      TRANSLATION_MODEL: facebook/nllb-200-distilled-600M
      DEVICE: cpu
      COLAB_TTS_URL: ${COLAB_TTS_URL:-}
      COLAB_TTS_TOKEN: ${COLAB_TTS_TOKEN:-}
      COLAB_TTS_TIMEOUT: ${COLAB_TTS_TIMEOUT:-300}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/dubbing/start
    volumes:
      - job-data:/data/jobs
      - model-cache:/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  n8n:
    image: n8nio/n8n:1.95.3
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PAYLOAD_SIZE_MAX: "256"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  job-data:
  model-cache:
  n8n-data:
